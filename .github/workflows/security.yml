name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets-and-private-leaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Private infra leak scan
        run: |
          echo "=== Private guard ==="
          BAD=0
          # Exclude this workflow file itself (it contains pattern strings for checking)
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "192\.168\.6\.98\|192\.168\.5\.161\|192\.168\.4\.41\|192\.168\.6\.69" . 2>/dev/null | grep -v "security.yml" | grep -v "192.168.1.100" | grep -q .; then
            echo "❌ Private LAN IP found in code (use 192.168.1.100 generic example)"
            grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "192\.168\.6\.98\|192\.168\.5\.161" . 2>/dev/null | grep -v "security.yml" | head -10
            BAD=1
          fi
          # Look for real private path leaks, not the guard pattern definitions
          LEAKS=$(grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "/mnt/nas/\|/home/zeta/" . 2>/dev/null | grep -v "security.yml" | grep -v "SECURITY.md" | grep -v "node_modules" | head -20 || true)
          if [ -n "$LEAKS" ]; then
            echo "❌ Private path leak found:"
            echo "$LEAKS"
            BAD=1
          fi
          # Vault ID is very specific — check code files only, not docs that explain it
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "tm7lhakyu4w7qkoock2bakxpia" --include="*.ts" --include="*.js" --include="*.json" . 2>/dev/null | grep -v "security.yml" | grep -q .; then
            echo "❌ Vault ID found in code"
            BAD=1
          fi
          if [ $BAD -ne 0 ]; then exit 1; fi
          echo "✅ Private guard PASS"

      - name: Secrets scan
        run: |
          echo "=== Secrets guard ==="
          # Real tokens — exclude workflow itself and examples
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "ghp_[A-Za-z0-9]\{36,\}" . 2>/dev/null | grep -v "example" | grep -v "security.yml" | grep -v "SECURITY.md" | grep -q .; then
            echo "❌ ghp_ token found"
            exit 1
          fi
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "BEGIN.*PRIVATE KEY" . 2>/dev/null | grep -v "security.yml" | grep -q .; then
            echo "❌ Private key found"
            exit 1
          fi
          if git ls-files | grep -E "auth\.json|device\.json|secrets\.json" | grep -q .; then
            echo "❌ Secret files tracked:"
            git ls-files | grep -E "auth\.json|device\.json|secrets\.json"
            exit 1
          fi
          echo "✅ Secrets guard PASS"

      - name: Dependency audit
        run: |
          npm ci
          npm audit --audit-level=high || echo "⚠️ npm audit (non-blocking)"

      - name: Check tracked files
        run: |
          echo "✅ No secret files tracked check done above"
