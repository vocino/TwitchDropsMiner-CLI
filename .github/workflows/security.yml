name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets-and-private-leaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Private path leak scan
        run: |
          echo "=== Private guard ==="
          BAD=0
          # Check for private LAN subnets — generic pattern, exclude workflow file that defines it
          LEAKS=$(grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "192\.168\.\(4\|5\|6\)\." . 2>/dev/null | grep -v "security.yml" | grep -v "192.168.1.100" | grep -v "192.168.1.1" | head -10 || true)
          if [ -n "$LEAKS" ]; then
            echo "❌ Private LAN subnet leak (192.168.4/5/6.x) - use 192.168.1.100 as example"
            echo "$LEAKS"
            BAD=1
          fi
          if [ $BAD -ne 0 ]; then exit 1; fi
          echo "✅ Private guard PASS"

      - name: Secrets scan
        run: |
          echo "=== Secrets guard ==="
          # Exclude workflow itself from scan to avoid matching its own pattern strings
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "ghp_[A-Za-z0-9]\{36,\}" . 2>/dev/null | grep -v "security.yml" | grep -v "SECURITY.md" | grep -v "example" | grep -q .; then
            echo "❌ GitHub PAT found"
            exit 1
          fi
          # Private key check — exclude workflow that defines the pattern
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "PRIVATE KEY" . --include="*.key" --include="*.pem" --include="*.ts" --include="*.js" --include="*.json" 2>/dev/null | grep -v "security.yml" | grep -v "SECURITY.md" | grep -q .; then
            echo "❌ Private key file or hardcoded key found"
            exit 1
          fi
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "_authToken=" . --include=".npmrc" . 2>/dev/null | grep -q .; then
            echo "❌ NPM auth token leaked"
            exit 1
          fi
          if git ls-files | grep -E "auth\.json|device\.json|secrets\.json" | grep -q .; then
            echo "❌ Secret files tracked"
            git ls-files | grep -E "auth\.json|device\.json|secrets\.json"
            exit 1
          fi
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "❌ .env tracked"
            exit 1
          fi
          echo "✅ Secrets guard PASS"

      - name: Dependency audit
        run: |
          npm ci
          npm audit --audit-level=high || echo "⚠️ npm audit high (non-blocking)"

      - name: Check tracked files
        run: |
          echo "✅ Security scans complete"
