name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets-and-private-leaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Private path leak scan (generic)
        run: |
          echo "=== Private guard (generic, no private values in repo) ==="
          BAD=0
          # Only check for obviously private generic patterns that are safe to mention
          # Real private IPs/paths are checked locally via oss-private-guard.sh (not in public repo)
          # Here we check for common leak patterns without revealing private values
          
          # Generic private LAN check: look for 192.168.x.x but allow 192.168.1.x example
          LEAKS=$(grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "192\.168\.\(4\|5\|6\)\." . 2>/dev/null | grep -v "192.168.1.100" | grep -v "192.168.1.1" | head -10 || true)
          if [ -n "$LEAKS" ]; then
            echo "❌ Private LAN subnet leak (192.168.4/5/6.x) - use 192.168.1.100 as example"
            echo "$LEAKS"
            BAD=1
          fi
          
          # Home directory absolute paths (generic)
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "/home/[a-z]\+/" --include="*.ts" --include="*.js" --include="*.md" . 2>/dev/null | grep -v "example" | grep -v "/home/runner" | head -10 | grep -q .; then
            echo "⚠️ Possible hardcoded home path in code (should use os.homedir() or example)"
            grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "/home/[a-z]\+/" --include="*.ts" . 2>/dev/null | grep -v "example" | head -10 || true
            # Non-blocking warning for now - some legitimate uses like "~/.config"
          fi
          
          if [ $BAD -ne 0 ]; then exit 1; fi
          echo "✅ Private guard PASS"

      - name: Secrets scan
        run: |
          echo "=== Secrets guard ==="
          # Real token patterns - generic regexes, no private values
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "ghp_[A-Za-z0-9]\{36,\}" . 2>/dev/null | grep -v "example" | grep -v "ghp_example" | grep -q .; then
            echo "❌ GitHub PAT found"
            exit 1
          fi
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "BEGIN.*PRIVATE KEY" . 2>/dev/null | grep -q .; then
            echo "❌ Private key found"
            exit 1
          fi
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "_authToken=" . --include=".npmrc" . 2>/dev/null | grep -q .; then
            echo "❌ NPM auth token leaked"
            exit 1
          fi
          if git ls-files | grep -E "auth\.json|device\.json|secrets\.json" | grep -q .; then
            echo "❌ Secret files tracked:"
            git ls-files | grep -E "auth\.json|device\.json|secrets\.json"
            exit 1
          fi
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "❌ .env tracked (should be gitignored)"
            exit 1
          fi
          echo "✅ Secrets guard PASS"

      - name: Dependency audit
        run: |
          npm ci
          npm audit --audit-level=high || echo "⚠️ npm audit high (non-blocking)"

      - name: Check tracked files
        run: |
          echo "✅ Security scans complete"
