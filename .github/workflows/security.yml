name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets-and-private-leaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Private infra leak scan (no LAN IPs, no private paths)
        run: |
          echo "=== Private guard ==="
          # We check for actual leaks, not the guard patterns themselves
          # Skip workflow files themselves to avoid self-referencing
          BAD=0
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude=".github/workflows/*" "192\\.168\\.6\\.98\\|192\\.168\\.5\\.161\\|192\\.168\\.4\\.41\\|192\\.168\\.6\\.69" . 2>/dev/null | grep -v "192.168.1.100" | grep -q .; then
            echo "❌ Private LAN IP found (use generic example)"
            BAD=1
          fi
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude=".github/workflows/*" "/mnt/nas\\|/opt/media.*Media\\|/home/zeta\\|tm7lhakyu4w7qkoock2bakxpia" . 2>/dev/null | grep -q .; then
            echo "❌ Private infra leak (mnt nas, home zeta, vault ID) — check files"
            BAD=1
          fi
          if [ $BAD -ne 0 ]; then exit 1; fi
          echo "✅ Private guard PASS"

      - name: Secrets scan (API keys, tokens, private keys)
        run: |
          echo "=== Secrets guard ==="
          BAD=0
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude=".github/workflows/*" "ghp_[A-Za-z0-9]\\{36,\\}\\|BEGIN.*PRIVATE KEY" . 2>/dev/null | grep -v "example\\|placeholder\\|dummy" | grep -q .; then
            echo "❌ Secret token/private key pattern found"
            BAD=1
          fi
          if git ls-files | grep -E "auth\\.json|device\\.json|secrets\\.json" | grep -q .; then
            echo "❌ Secret files tracked:"
            git ls-files | grep -E "auth\\.json|device\\.json|secrets\\.json"
            exit 1
          fi
          if [ $BAD -ne 0 ]; then exit 1; fi
          echo "✅ Secrets guard PASS"

      - name: Dependency audit
        run: |
          npm ci
          npm audit --audit-level=high || echo "⚠️ npm audit (non-blocking)"

      - name: Check for secret files tracked
        run: |
          if git ls-files | grep -E "auth\\.json|device\\.json|secrets\\.json" | grep -q .; then
            echo "❌ Secret files tracked:"
            git ls-files | grep -E "auth\\.json|device\\.json|secrets\\.json"
            exit 1
          fi
          echo "✅ No secret files tracked"
