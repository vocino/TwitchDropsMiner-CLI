name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets-and-private-leaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Private infra leak scan (no LAN IPs, no /mnt/nas, no 1P refs)
        run: |
          echo "=== Private guard ==="
          BAD=0
          # Check for real LAN IPs (allow generic examples)
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "192\.168\.6\.98\|192\.168\.5\.161\|192\.168\.4\.41\|192\.168\.6\.69\|192\.168\.4\.69" . 2>/dev/null | grep -v "192.168.1.100" | grep -q .; then
            echo "❌ Private LAN IP found (use 192.168.1.100 example)"
            grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "192\.168\.6\.98\|192\.168\.5\.161\|192\.168\.4\.41\|192\.168\.6\.69" . | head -10
            BAD=1
          fi
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "/mnt/nas\|/opt/media.*Media\|/home/zeta\|op://\|tm7lhakyu4w7qkoock2bakxpia\|1486217036920" . 2>/dev/null | grep -q .; then
            echo "❌ Private infra leak (mnt nas, home zeta, op://, Discord IDs)"
            grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "/mnt/nas\|/home/zeta\|op://\|1486217036920" . | head -10
            BAD=1
          fi
          if [ $BAD -ne 0 ]; then exit 1; fi
          echo "✅ Private guard PASS"

      - name: Secrets scan (API keys, tokens, private keys)
        run: |
          echo "=== Secrets guard ==="
          BAD=0
          # GHP tokens
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "ghp_[A-Za-z0-9]\{36,\}\|github_pat_[A-Za-z0-9_]\{60,\}\|npm_[A-Za-z0-9]\{36,\}" . 2>/dev/null | grep -v "example\|placeholder\|dummy\|ghp_example" | grep -q .; then
            echo "❌ Secret token pattern found (ghp_/github_pat_/npm_)"
            grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "ghp_\|github_pat_\|npm_" . | grep -v example | head -10
            BAD=1
          fi
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "BEGIN.*PRIVATE KEY" . 2>/dev/null | grep -q .; then
            echo "❌ Private key found"
            BAD=1
          fi
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist "_authToken=" . --include="*.npmrc" --include="*.env" 2>/dev/null | grep -q .; then
            echo "❌ NPM _authToken leaked"
            BAD=1
          fi
          # Check .env tracked
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "❌ .env tracked (should be gitignored)"
            BAD=1
          fi
          if [ $BAD -ne 0 ]; then exit 1; fi
          echo "✅ Secrets guard PASS"

      - name: Dependency audit
        run: |
          npm ci
          npm audit --audit-level=high || echo "⚠️ npm audit found issues (non-blocking for now)"

      - name: Check for auth.json / device.json tracked
        run: |
          if git ls-files | grep -E "auth\.json|device\.json|secrets\.json" | grep -q .; then
            echo "❌ Secret files tracked:"
            git ls-files | grep -E "auth\.json|device\.json|secrets\.json"
            exit 1
          fi
          echo "✅ No secret files tracked"
