name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check if version already published
        id: check
        run: |
          VER=$(node -p "require('./package.json').version")
          PUB=$(npm view twitchdropsminer-cli version 2>/dev/null || echo "0.0.0")
          echo "local=$VER published=$PUB"
          if [ "$VER" = "$PUB" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version $VER already published, skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish
        if: steps.check.outputs.skip == 'false'
        run: |
          # Try OIDC trusted publishing first, fallback to error message
          npm publish --provenance --access public || {
            echo "::error::npm publish failed. If trusted publishing not configured, add NPM_TOKEN secret or set up trusted publisher at https://www.npmjs.com/package/twitchdropsminer-cli/access"
            echo "To fix: npmjs.com → package → Settings → Trusted Publishers → add GitHub repo vocino/TwitchDropsMiner-CLI workflow publish.yml"
            exit 1
          }
