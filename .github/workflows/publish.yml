name: Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check if version already published
        id: check
        run: |
          VER=$(node -p "require('./package.json').version")
          PUB=$(npm view twitchdropsminer-cli version 2>/dev/null || echo "0.0.0")
          echo "local=$VER published=$PUB"
          echo "version=$VER" >> $GITHUB_OUTPUT
          if [ "$VER" = "$PUB" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version $VER already published, skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish with OIDC trusted publishing (provenance)
        if: steps.check.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER=${{ steps.check.outputs.version }}
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER=${{ github.ref_name }}
            TAG_VER=${TAG_VER#v}
            if [ "$VER" != "$TAG_VER" ]; then
              echo "::warning::package.json version $VER != tag $TAG_VER, using package.json"
            fi
          fi
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN present — fallback available if OIDC fails"
          else
            echo "NPM_TOKEN not set — OIDC only (must have trusted publisher configured)"
          fi
          echo "Publishing $VER to npm..."
          echo "Attempt 1: npm publish --provenance --access public (OIDC)"
          set +e
          npm publish --provenance --access public 2>&1 | tee /tmp/publish-provenance.log
          PROV_EXIT=${PIPESTATUS[0]}
          echo "Provenance exit code: $PROV_EXIT"
          if [ $PROV_EXIT -eq 0 ]; then
            echo "✅ Published $VER with provenance (OIDC)!"
            exit 0
          fi
          echo "— Provenance publish failed (exit $PROV_EXIT). Log tail:"
          tail -40 /tmp/publish-provenance.log 2>&1 | head -40
          echo ""
          echo "Attempt 2: npm publish --access public (NPM_TOKEN fallback)"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Provenance failed and no NPM_TOKEN available. Publish cannot continue."
            echo "::error::Fix: npmjs.com -> twitchdropsminer-cli -> Settings -> Trusted Publishers -> vocino/TwitchDropsMiner-CLI publish.yml"
            echo "::error::OR: https://www.npmjs.com/settings/tokens -> Automation token -> add as NPM_TOKEN at https://github.com/vocino/TwitchDropsMiner-CLI/settings/secrets/actions"
            tail -20 /tmp/publish-provenance.log
            exit 1
          fi
          npm publish --access public 2>&1 | tee /tmp/publish-token.log
          TOKEN_EXIT=${PIPESTATUS[0]}
          echo "Token fallback exit code: $TOKEN_EXIT"
          if [ $TOKEN_EXIT -eq 0 ]; then
            echo "✅ Published $VER via NPM_TOKEN fallback (no provenance)!"
            exit 0
          fi
          echo "::error::Both provenance and token publish failed."
          echo "Provenance log tail:"
          tail -20 /tmp/publish-provenance.log
          echo "Token log tail:"
          tail -20 /tmp/publish-token.log
          exit 1
